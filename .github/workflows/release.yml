name: Build and Release DJ Crate

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build Windows Release
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip --progress-bar off
          pip install pyinstaller --progress-bar off
          if (Test-Path "requirements.txt") { pip install -r requirements.txt --progress-bar off }

      - name: Generate Icon (if needed)
        run: |
          python -c "
          import os
          from PIL import Image, ImageDraw
          os.makedirs('assets', exist_ok=True)
          if not os.path.exists('assets/icon.ico'):
              img = Image.new('RGBA', (256, 256), (0, 0, 0, 0))
              d = ImageDraw.Draw(img)
              d.ellipse((10, 10, 246, 246), fill=(255, 85, 0))
              img.save('assets/icon.ico')
          "

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller build.spec

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y

      - name: Compile Installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" djcrate_installer.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Releases/DJ_Crate_Installer.exe
          name: DJ Crate ${{ github.ref_name }}
          body: |
            ## 🎛️ DJ Crate ${{ github.ref_name }}

            Welcome to **DJ Crate ${{ github.ref_name }}**! This release brings professional DJ software integration, mix splitting tools, crate playlist export, and enhanced metadata controls.

            ---

            ### 🚀 What's New in this Release

            #### 🎧 Direct DJ Software Drag & Drop
            - Drag single or multiple tracks directly into **Serato DJ**, **Rekordbox**, **Traktor**, or Windows Explorer.

            #### ✂️ Mix Splitter (Timestamp Parser)
            - Parse tracklist timestamps (e.g. `00:00 Intro`, `03:45 Song`) to automatically cut long audio DJ mixes into tagged individual tracks via `FFmpeg`.

            #### 📁 Crate M3U / M3U8 Playlist Export
            - Export manual and smart crates to standard `.m3u8` playlists for seamless import into DJ software.

            #### 🎵 Beatport Catalog Integration
            - Automatic Beatport search fallback for electronic, techno, house, and underground music metadata & cover art when iTunes returns no results.

            #### 🏷️ Bulk Metadata Tag Editor
            - Multi-select tracks in your library and batch-edit Artist, Album, Genre, and Release Year in a single dialog.

            #### 🎚️ Pitch / Tempo Slider & Collapsible Sidebar
            - **Pitch Fader**: Test track speed adjustments (-20% to +20%) with reset button directly on the player bar.
            - **Collapsible Sidebar**: Switch between full text mode and icon-only mode to save horizontal space on laptop screens.

            #### ⚡ Persistent Artwork Caching
            - Artwork cached persistently in `~/.djcrate_cache/thumbs/` for faster search performance across application launches.

            ---

            ### ⚠️ Windows Defender SmartScreen Notice
            > **Note for Windows Users:** Because DJ Crate is open-source indie software and not signed with an EV Code Signing Certificate, Windows Defender SmartScreen may label it as an "Unrecognized App".
            > 
            > **How to install safely:**
            > 1. Run `DJ_Crate_Installer.exe`.
            > 2. Click **"More info"**.
            > 3. Click **"Run anyway"**.

            ---

            ### 🛠️ Installation Instructions
            1. Download **`DJ_Crate_Installer.exe`** from the Assets section below.
            2. Run the installer to install or upgrade DJ Crate on your system.
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: "--use-system-ca"
