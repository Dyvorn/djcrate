name: Build and Release DJ Crate

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build Windows Release
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Read version from package
        id: version
        shell: pwsh
        run: |
          $version = python -c "from djcrate import __version__; print(__version__)"
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip --progress-bar off
          pip install pyinstaller Pillow --progress-bar off
          if (Test-Path "requirements.txt") { pip install -r requirements.txt --progress-bar off }

      - name: Generate App Icon
        shell: pwsh
        run: |
          python -c "
          import os
          from PIL import Image, ImageDraw
          os.makedirs('assets', exist_ok=True)
          if not os.path.exists('assets/icon.ico'):
              img = Image.new('RGBA', (256, 256), (0, 0, 0, 0))
              d = ImageDraw.Draw(img)
              d.ellipse((10, 10, 246, 246), fill=(196, 125, 99))
              d.ellipse((70, 70, 186, 186), fill=(20, 18, 18))
              d.ellipse((100, 100, 156, 156), fill=(196, 125, 99))
              img.save('assets/icon.ico')
          print('Icon ready.')
          "

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller build.spec

      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\DJ Crate\DJ Crate.exe")) {
            Write-Error "PyInstaller build failed — DJ Crate.exe not found in dist/"
            exit 1
          }
          Write-Host "Build OK: dist\DJ Crate\DJ Crate.exe"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile Installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" djcrate_installer.iss

      - name: Verify installer output
        shell: pwsh
        run: |
          if (-not (Test-Path "Releases\DJ_Crate_Installer.exe")) {
            Write-Error "Inno Setup failed — DJ_Crate_Installer.exe not found in Releases/"
            exit 1
          }
          $size = (Get-Item "Releases\DJ_Crate_Installer.exe").Length / 1MB
          Write-Host "Installer OK: $([math]::Round($size, 1)) MB"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Releases/DJ_Crate_Installer.exe
          name: DJ Crate ${{ github.ref_name }}
          body: |
            ## 🎛️ DJ Crate ${{ github.ref_name }}

            ### What's new

            > _See the auto-generated release notes below for the full commit list._

            ### ✨ v0.3.1 — Quality Pass

            - **Fixed** clipboard HUD download crashing with `TypeError` (missing `duration` arg)
            - **Fixed** Gig Matcher crashing on any library that had BPM data analysed
            - **Fixed** Metadata Editor only guessing tags from filename — now reads actual embedded ID3/FLAC/MP4 tags
            - **Fixed** pitch fader label showing `+5.0%` instead of `+5%`
            - **Performance** Queue rows now update in-place instead of being destroyed and recreated on every download tick
            - **UX** Clipboard HUD now slides in smoothly from the bottom-right corner (300ms ease-out)
            - **UX** Gig Matcher results are now colour-coded by match quality (🟢 green / 🟡 yellow / 🔴 red)
            - **UX** Clipboard downloads now log a meaningful title (e.g. `YouTube/dQw4w9WgXcQ`) instead of "Quick Capture Track"
            - **DRY** Extracted shared helpers for track row creation, analysis thread launch, and context menu styling
            - **Docs** Added module/class docstrings to all workers and companion widgets

            ---

            ### ⚠️ Windows Defender SmartScreen Notice

            Because DJ Crate is open-source indie software not signed with an EV Code Signing Certificate,
            Windows may show an "Unrecognized App" warning.

            **How to install safely:**
            1. Run `DJ_Crate_Installer.exe`
            2. Click **"More info"**
            3. Click **"Run anyway"**

            ---

            ### 🛠️ Installation
            1. Download **`DJ_Crate_Installer.exe`** from the Assets section below.
            2. Run the installer. DJ Crate will be added to your Start Menu and optionally your Desktop.
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: "--use-system-ca"
