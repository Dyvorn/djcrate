name: Build and Release DJ Crate

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build Windows Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip --progress-bar off
          pip install pyinstaller --progress-bar off
          if (Test-Path "requirements.txt") { pip install -r requirements.txt --progress-bar off }

      - name: Generate Icon (if needed)
        run: |
          python -c "
          import os
          from PIL import Image, ImageDraw
          os.makedirs('assets', exist_ok=True)
          if not os.path.exists('assets/icon.ico'):
              img = Image.new('RGBA', (256, 256), (0, 0, 0, 0))
              d = ImageDraw.Draw(img)
              d.ellipse((10, 10, 246, 246), fill=(255, 85, 0))
              img.save('assets/icon.ico')
          "

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller build.spec

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y

      - name: Compile Installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" djcrate_installer.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Releases/DJ_Crate_Installer.exe
          name: DJ Crate ${{ github.ref_name }}
          body: |
            ## 💿 DJ Crate ${{ github.ref_name }}
            
            Welcome to the release of DJ Crate ${{ github.ref_name }}! 
            
            ### 🛠 Installation Instructions
            1. Download the **`DJ_Crate_Installer.exe`** file below.
            2. Run the installer to set up DJ Crate on your system.
            
            ---
            ### 📝 Release Notes
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
